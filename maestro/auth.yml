appId: com.nicolasobp.digitalnomadapp
---
- tapOn:
    id: "email-input"
- inputText: "nicolasobp15@gmail.com"

- tapOn:
    id: "password-input"
- inputText: "12345678"

- hideKeyboard

- tapOn:
    text: "Entrar"

- assertVisible: ".*signed in.*"

# Sign out
- tapOn:
    text: .*Perfil.*

- repeat:
    while:
      notVisible: ".*Bem Vindo.*"
    commands:
      - tapOn:
          id: "sign-out-button"

- assertVisible: ".*Bem Vindo.*"
